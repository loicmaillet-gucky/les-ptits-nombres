<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecteur de texte vocal</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --border-color: #e5e7eb;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .container {
      background-color: var(--card-bg);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      resize: vertical;
      box-sizing: border-box;
      margin-bottom: 1.5rem;
    }

    .menu-settings {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      background-color: #f9fafb;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border-color);
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
    }

    select, input[type="range"] {
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button.secondary {
      background-color: #6b7280;
    }

    button.secondary:hover {
      background-color: #4b5563;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Lecteur Synthèse Vocale</h1>

  <!-- Zone de texte -->
  <textarea id="text-input" placeholder="Saisissez ou collez votre texte ici..."></textarea>

  <!-- Menu Réglages (sans défilement automatique) -->
  <div class="menu-settings">
    <div class="setting-item">
      <label for="voice-select">Voix</label>
      <select id="voice-select">
        <option value="">Chargement des voix...</option>
      </select>
    </div>

    <div class="setting-item">
      <label for="rate-range">Vitesse (<span id="rate-value">1</span>)</label>
      <input type="range" id="rate-range" min="0.5" max="2" value="1" step="0.1">
    </div>

    <div class="setting-item">
      <label for="pitch-range">Hauteur (<span id="pitch-value">1</span>)</label>
      <input type="range" id="pitch-range" min="0.5" max="1.5" value="1" step="0.1">
    </div>
  </div>

  <!-- Commandes de lecture -->
  <div class="controls">
    <button id="btn-play">Lire</button>
    <button id="btn-pause" class="secondary">Pause</button>
    <button id="btn-stop" class="secondary">Arrêter</button>
  </div>
</div>

<script>
  const synth = window.speechSynthesis;

  // Éléments du DOM
  const textInput = document.getElementById('text-input');
  const voiceSelect = document.getElementById('voice-select');
  const rateRange = document.getElementById('rate-range');
  const rateValue = document.getElementById('rate-value');
  const pitchRange = document.getElementById('pitch-range');
  const pitchValue = document.getElementById('pitch-value');

  const btnPlay = document.getElementById('btn-play');
  const btnPause = document.getElementById('btn-pause');
  const btnStop = document.getElementById('btn-stop');

  let voices = [];

  // Charger la liste des voix disponibles
  function chargerVoix() {
    voices = synth.getVoices().filter(voice => voice.lang.startsWith('fr'));
    
    // Si aucune voix française n'est trouvée, charger toutes les voix
    if (voices.length === 0) {
      voices = synth.getVoices();
    }

    voiceSelect.innerHTML = voices
      .map((voice, index) => `<option value="${index}">${voice.name} (${voice.lang})</option>`)
      .join('');
  }

  chargerVoix();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = chargerVoix;
  }

  // Fonction de correction phonétique ("ein" -> "un")
  function corrigerPrononciation(texte) {
    return texte.replace(/ein/gi, 'un');
  }

  // Démarrer la lecture
  function lireTexte() {
    if (synth.speaking) {
      synth.cancel(); // Réinitialise si une lecture est déjà en cours
    }

    const texteOriginal = textInput.value.trim();
    if (!texteOriginal) return;

    // Application de la règle de prononciation
    const texteAjuste = corrigerPrononciation(texteOriginal);

    const utterance = new SpeechSynthesisUtterance(texteAjuste);

    // Attribution de la voix sélectionnée
    if (voices[voiceSelect.value]) {
      utterance.voice = voices[voiceSelect.value];
    }

    utterance.rate = parseFloat(rateRange.value);
    utterance.pitch = parseFloat(pitchRange.value);

    synth.speak(utterance);
  }

  // Événements sur les commandes
  btnPlay.addEventListener('click', () => {
    if (synth.paused) {
      synth.resume();
    } else {
      lireTexte();
    }
  });

  btnPause.addEventListener('click', () => {
    if (synth.speaking && !synth.paused) {
      synth.pause();
    }
  });

  btnStop.addEventListener('click', () => {
    if (synth.speaking) {
      synth.cancel();
    }
  });

  // Mise à jour de l'affichage des valeurs de curseurs
  rateRange.addEventListener('input', () => {
    rateValue.textContent = rateRange.value;
  });

  pitchRange.addEventListener('input', () => {
    pitchValue.textContent = pitchRange.value;
  });
</script>

</body>
</html>
