<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Les P'tits Nombres & Lettres</title>
    <style>
        :root {
            --bg-primary: #121826;
            --bg-card: #1f293d;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --text-main: #ffffff;
            --text-sub: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        .screen {
            display: none; flex-direction: column;
            height: 100%; width: 100%; padding: 20px;
            position: absolute; top: 0; left: 0;
        }

        .screen.active { display: flex; }

        .app-header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 10px;
        }

        .app-title {
            font-size: 24px; font-weight: 800;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .btn-icon {
            background: var(--bg-card); border: none; color: white;
            font-size: 24px; width: 50px; height: 50px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .menu-grid {
            display: grid; grid-template-columns: 1fr;
            gap: 15px; flex: 1; margin-top: 15px; overflow-y: auto;
        }

        @media (min-width: 600px) {
            .menu-grid { grid-template-columns: 1fr 1fr; }
        }

        .menu-btn {
            background: var(--bg-card); border: 3px solid transparent;
            border-radius: 20px; padding: 20px;
            display: flex; align-items: center; gap: 15px;
            color: white; font-size: 22px; font-weight: bold;
            cursor: pointer; transition: transform 0.1s;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .menu-btn:active { transform: scale(0.98); }
        .menu-btn.green { border-color: var(--accent-green); }
        .menu-btn.yellow { border-color: var(--accent-yellow); }
        .menu-btn.red { border-color: var(--accent-red); }
        .menu-btn.blue { border-color: var(--accent-blue); }
        .menu-btn.purple { border-color: var(--accent-purple); }

        .menu-btn .badge {
            width: 45px; height: 45px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; font-size: 24px;
        }

        .display-area {
            flex: 1; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
        }

        .main-display {
            font-size: clamp(60px, 20vw, 180px);
            font-weight: 900; text-align: center; transition: opacity 0.3s;
        }

        .sequence-display {
            display: flex; flex-wrap: wrap; justify-content: center;
            align-items: center; gap: 10px; width: 100%; max-width: 650px;
        }

        .seq-box {
            background: var(--bg-card); border: 2px solid #374151;
            border-radius: 15px; padding: 12px 18px; font-size: 30px;
            font-weight: bold; color: white; min-width: 75px; text-align: center;
        }

        .seq-box.missing {
            border-color: var(--accent-yellow); color: var(--accent-yellow);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .controls {
            display: flex; gap: 15px; justify-content: center; align-items: center; padding: 20px 0;
            flex-wrap: wrap;
        }

        .btn-action {
            background: var(--accent-blue); color: white; border: none;
            padding: 16px 36px; border-radius: 50px;
            font-size: 22px; font-weight: bold; cursor: pointer;
            box-shadow: 0 6px 15px rgba(59, 130, 246, 0.4);
            display: inline-flex; align-items: center; gap: 10px;
        }

        .btn-action:active { transform: scale(0.95); }

        .btn-mic {
            background: var(--accent-red);
            box-shadow: 0 6px 15px rgba(239, 68, 68, 0.4);
        }

        .btn-mic.listening {
            background: var(--accent-yellow);
            animation: pulse 1s infinite;
        }

        .toggle-group {
            display: flex; background: var(--bg-card);
            border-radius: 15px; padding: 5px; margin-bottom: 10px;
        }

        .toggle-btn {
            flex: 1; padding: 10px 15px; border: none; background: transparent;
            color: var(--text-sub); font-size: 15px; font-weight: bold;
            border-radius: 10px; cursor: pointer;
        }

        .toggle-btn.active { background: var(--accent-blue); color: white; }

        .quiz-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 15px; width: 100%; max-width: 500px; margin-top: 15px;
        }

        .quiz-choice {
            background: var(--bg-card); border: 2px solid #374151;
            border-radius: 20px; padding: 20px;
            font-size: 36px; font-weight: bold; color: white;
            cursor: pointer; text-align: center;
        }

        .reward-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(18, 24, 38, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }

        .reward-overlay.show { opacity: 1; pointer-events: auto; }

        .reward-msg {
            font-size: 48px; font-weight: 900; color: #f59e0b; text-align: center;
            animation: bounce 0.6s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }

        .setting-row {
            background: var(--bg-card); padding: 18px; border-radius: 15px;
            margin-bottom: 15px; display: flex; justify-content: space-between;
            align-items: center; font-size: 18px;
        }

        select {
            background: #121826; color: white; border: 1px solid #374151;
            padding: 10px 14px; border-radius: 10px; font-size: 16px; width: 220px;
        }
    </style>
</head>
<body>

    <div id="rewardOverlay" class="reward-overlay">
        <div id="rewardMsg" class="reward-msg"></div>
    </div>

    <div id="screenMenu" class="screen active">
        <div class="app-header">
            <div class="app-title">LES P'TITS NOMBRES</div>
            <button class="btn-icon" onclick="openScreen('screenSettings')">⚙️</button>
        </div>
        <div class="menu-grid">
            <button class="menu-btn green" onclick="startNumbers(0, 1001)">
                <div class="badge" style="background:#064e3b; color:#34d399;">🔢</div>
                Nombres (0 - 1001)
            </button>
            <button class="menu-btn blue" onclick="startSequence()">
                <div class="badge" style="background:#1e3a8a; color:#60a5fa;">🧩</div>
                Suites de nombres
            </button>
            <button class="menu-btn blue" onclick="startLetters()">
                <div class="badge" style="background:#1e3a8a; color:#60a5fa;">🔤</div>
                Lettres (A-Z)
            </button>
            <button class="menu-btn purple" onclick="startSyllables()">
                <div class="badge" style="background:#4c1d95; color:#c084fc;">📚</div>
                Syllabes
            </button>
            <button class="menu-btn green" onclick="startQuiz()">
                <div class="badge" style="background:#065f46; color:#10b981;">🎮</div>
                Mode Quiz
            </button>
        </div>
    </div>

    <div id="screenDisplay" class="screen">
        <div class="app-header">
            <button class="btn-icon" onclick="stopAutoAndBack()">🏠</button>
            <div id="displayTitle" style="font-weight: bold; color: var(--text-sub)">Mode</div>
            <button class="btn-icon" onclick="speakCurrent()">🔊</button>
        </div>

        <div id="lettersToggle" class="toggle-group" style="display:none; margin: 10px auto;">
            <button id="btnMAJ" class="toggle-btn active" onclick="setCase(true)">MAJUSCULES</button>
            <button id="btnMIN" class="toggle-btn" onclick="setCase(false)">minuscules</button>
        </div>

        <div id="syllablesToggle" class="toggle-group" style="display:none; margin: 10px auto;">
            <button id="btnSylN1" class="toggle-btn active" onclick="setSyllablesLevel(1)">Niveau 1</button>
            <button id="btnSylN2" class="toggle-btn" onclick="setSyllablesLevel(2)">Niveau 2</button>
        </div>

        <div class="display-area">
            <div id="mainText" class="main-display">0</div>
            <div id="sequenceArea" class="sequence-display" style="display:none;"></div>
            <div id="displaySpeechStatus" style="font-size: 18px; color: var(--accent-yellow); margin-top: 15px; min-height: 24px;"></div>
        </div>

        <div class="controls">
            <button id="btnSeqMic" class="btn-action btn-mic" style="display:none;" onclick="startSeqVoiceRecognition()">🎤 Proposer la réponse</button>
            <button class="btn-action" onclick="nextItem()">SUIVANT ➔</button>
        </div>
    </div>

    <div id="screenQuiz" class="screen">
        <div class="app-header">
            <button class="btn-icon" onclick="openScreen('screenMenu')">🏠</button>
            <div style="font-weight: bold; color: var(--text-sub)">Quiz Interactif</div>
            <div id="scoreDisplay" style="font-size: 20px; font-weight: bold; color: #f59e0b;">⭐ 0</div>
        </div>

        <div class="toggle-group" style="margin: 5px auto; width: 100%; max-width: 500px;">
            <button id="btnQuizCatNumbers" class="toggle-btn active" onclick="setQuizCategory('numbers')">123 Nombres</button>
            <button id="btnQuizCatSeq" class="toggle-btn" onclick="setQuizCategory('sequence')">🧩 Suites</button>
            <button id="btnQuizCatSyllables" class="toggle-btn" onclick="setQuizCategory('syllables')">📚 Syllabes</button>
        </div>

        <div id="quizTypeGroup" class="toggle-group" style="margin: 5px auto; width: 100%; max-width: 500px;">
            <button id="btnQuizMode1" class="toggle-btn active" onclick="setQuizMode(1)">Trouve la valeur</button>
            <button id="btnQuizMode2" class="toggle-btn" onclick="setQuizMode(2)">Répète après moi</button>
        </div>

        <div id="quizSylGroup" class="toggle-group" style="display:none; margin: 5px auto; width: 100%; max-width: 500px;">
            <button id="btnQuizSylN1" class="toggle-btn active" onclick="setQuizSylLevel(1)">Syllabes N1</button>
            <button id="btnQuizSylN2" class="toggle-btn" onclick="setQuizSylLevel(2)">Syllabes N2</button>
        </div>

        <div class="display-area">
            <div id="quizPrompt" style="font-size: 20px; text-align: center; margin-bottom: 10px; color: var(--text-sub);">
                Écoute et choisis la bonne réponse :
            </div>
            
            <div id="quizBigDisplay" class="main-display" style="display:none;">?</div>
            <div id="quizSeqDisplay" class="sequence-display" style="display:none; margin-bottom:15px;"></div>

            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <button id="btnListenAgain" class="btn-action" style="display:none;" onclick="speakCurrentQuiz()">🔊 Réécouter</button>
                <button id="btnMic" class="btn-action btn-mic" onclick="startVoiceRecognition()">🎤 Dicter ta réponse</button>
            </div>

            <div id="speechStatus" style="font-size: 16px; color: var(--accent-yellow); margin-bottom: 10px; min-height: 24px;"></div>

            <div id="quizChoices" class="quiz-grid"></div>
        </div>
    </div>

    <div id="screenSettings" class="screen">
        <div class="app-header">
            <button class="btn-icon" onclick="openScreen('screenMenu')">🏠</button>
            <div style="font-weight: bold; color: white">Paramètres</div>
            <div style="width: 50px;"></div>
        </div>

        <div style="margin-top: 20px;">
            <div class="setting-row">
                <span>Style de voix</span>
                <div class="setting-control">
                    <select id="voiceStyleSelect">
                        <option value="canard" selected>🦆 Canard Enjoué</option>
                        <option value="hero">🚀 Super-Héros</option>
                        <option value="alien">👽 Alien de l'Espace</option>
                        <option value="speaker">📻 Présentateur TV</option>
                    </select>
                </div>
            </div>
            <div class="setting-row">
                <span>Défilement Auto</span>
                <div class="setting-control">
                    <input type="checkbox" id="autoCheck" style="width: 25px; height: 25px;">
                </div>
            </div>
            <div class="setting-row">
                <span>Délai d'affichage</span>
                <div class="setting-control">
                    <input type="range" id="autoDelay" min="1" max="30" value="5" oninput="document.getElementById('delayVal').innerText = this.value + 's'">
                    <span id="delayVal" style="width: 35px;">5s</span>
                </div>
            </div>
            <div class="setting-row">
                <span>Masquer avant d'afficher</span>
                <div class="setting-control">
                    <input type="range" id="hideDelay" min="0" max="5" value="0" oninput="document.getElementById('hideVal').innerText = this.value + 's'">
                    <span id="hideVal" style="width: 35px;">0s</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentMode = '';
        let currentMinNumber = 0;
        let currentMaxNumber = 1001;
        let isUppercase = true;
        let currentRawLetter = 'A';
        let syllablesLevel = 1;
        let currentValue = '';
        let currentSeqTarget = 0;
        let isSeqRevealed = false;
        let autoTimer = null;

        let quizScore = 0;
        let quizCategory = 'numbers'; 
        let quizSylLevel = 1;         
        let quizTarget = '';
        let quizMode = 1;             

        const syllablesN1 = ["ba","be","bi","bo","bu","ca","ce","ci","co","cu","da","de","di","do","du","fa","fe","fi","fo","fu","ga","ge","gi","go","gu","la","le","li","lo","lu","ma","me","mi","mo","mu","na","ne","ni","no","nu","pa","pe","pi","po","pu","ra","re","ri","ro","ru","sa","se","si","so","su","ta","te","ti","tu","va","ve","vi","vo","vu"];
        const syllablesN2 = ["cha","che","chi","cho","chu","bra","bre","bri","bro","bru","pla","ple","pli","plo","plu","tra","tre","tri","tro","tru"];

        const rewards = [
            { icon: "🎉", word: "Bravo !" },
            { icon: "⭐", word: "Super !" },
            { icon: "🏆", word: "Capitaine des Nombres !" }
        ];

        function formatSpeechText(text, forceSyllables = false) {
            if (!text && text !== 0) return '';
            const strText = text.toString();
            if (currentMode === 'syllables' || forceSyllables) {
                const letters = strText.toUpperCase().split('').join('... ');
                return `${letters}... ${strText}`;
            }
            return strText;
        }

        function speak(text, forceSyllables = false) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                const spokenText = formatSpeechText(text, forceSyllables);
                if (!spokenText) return;

                const utterance = new SpeechSynthesisUtterance(spokenText);
                utterance.lang = 'fr-FR';

                const voices = window.speechSynthesis.getVoices();
                const frVoice = voices.find(v => v.lang.startsWith('fr'));
                if (frVoice) utterance.voice = frVoice;

                const style = document.getElementById('voiceStyleSelect').value;
                switch (style) {
                    case 'canard':
                        utterance.pitch = 1.4; utterance.rate = 0.8; break;
                    case 'hero':
                        utterance.pitch = 0.7; utterance.rate = 0.7; break;
                    case 'alien':
                        utterance.pitch = 1.8; utterance.rate = 0.6; break;
                    case 'speaker':
                        utterance.pitch = 1.0; utterance.rate = 0.8; break;
                    default:
                        utterance.pitch = 1.0; utterance.rate = 0.8;
                }

                window.speechSynthesis.speak(utterance);
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        }

        function openScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function stopAutoAndBack() {
            clearTimeout(autoTimer);
            window.speechSynthesis.cancel();
            openScreen('screenMenu');
        }

        function startNumbers(min = 0, max = 1001) {
            currentMode = 'numbers';
            currentMinNumber = min;
            currentMaxNumber = max;
            document.getElementById('displayTitle').innerText = `Nombres (${min}-${max})`;
            document.getElementById('lettersToggle').style.display = 'none';
            document.getElementById('syllablesToggle').style.display = 'none';
            document.getElementById('sequenceArea').style.display = 'none';
            document.getElementById('btnSeqMic').style.display = 'none';
            document.getElementById('displaySpeechStatus').innerText = '';
            document.getElementById('mainText').style.display = 'block';
            openScreen('screenDisplay');
            nextItem();
        }

        function startSequence() {
            currentMode = 'sequence';
            document.getElementById('displayTitle').innerText = "Suite de Nombres";
            document.getElementById('lettersToggle').style.display = 'none';
            document.getElementById('syllablesToggle').style.display = 'none';
            document.getElementById('mainText').style.display = 'none';
            document.getElementById('sequenceArea').style.display = 'flex';
            document.getElementById('btnSeqMic').style.display = 'inline-flex';
            document.getElementById('displaySpeechStatus').innerText = '';
            openScreen('screenDisplay');
            nextItem();
        }

        function startLetters() {
            currentMode = 'letters';
            document.getElementById('displayTitle').innerText = "Lettres";
            document.getElementById('lettersToggle').style.display = 'flex';
            document.getElementById('syllablesToggle').style.display = 'none';
            document.getElementById('sequenceArea').style.display = 'none';
            document.getElementById('btnSeqMic').style.display = 'none';
            document.getElementById('displaySpeechStatus').innerText = '';
            document.getElementById('mainText').style.display = 'block';
            openScreen('screenDisplay');
            nextItem();
        }

        function setCase(upper) {
            isUppercase = upper;
            document.getElementById('btnMAJ').classList.toggle('active', upper);
            document.getElementById('btnMIN').classList.toggle('active', !upper);
            
            if (currentMode === 'letters') {
                currentValue = isUppercase ? currentRawLetter : currentRawLetter.toLowerCase();
                document.getElementById('mainText').innerText = currentValue;
                speak(currentValue);
            }
        }

        function startSyllables() {
            currentMode = 'syllables';
            document.getElementById('displayTitle').innerText = "Syllabes";
            document.getElementById('lettersToggle').style.display = 'none';
            document.getElementById('syllablesToggle').style.display = 'flex';
            document.getElementById('sequenceArea').style.display = 'none';
            document.getElementById('btnSeqMic').style.display = 'none';
            document.getElementById('displaySpeechStatus').innerText = '';
            document.getElementById('mainText').style.display = 'block';
            openScreen('screenDisplay');
            nextItem();
        }

        function setSyllablesLevel(lvl) {
            syllablesLevel = lvl;
            document.getElementById('btnSylN1').classList.toggle('active', lvl === 1);
            document.getElementById('btnSylN2').classList.toggle('active', lvl === 2);
            nextItem();
        }

        function revealSeqTarget() {
            if (isSeqRevealed) return;
            isSeqRevealed = true;
            const targetBox = document.getElementById('seqTargetBox');
            if (targetBox) {
                targetBox.innerText = currentSeqTarget;
                speak(`Le nombre manquant est ${currentSeqTarget}`);
            }
        }

        function nextItem() {
            clearTimeout(autoTimer);
            const mainDisplay = document.getElementById('mainText');
            const seqArea = document.getElementById('sequenceArea');
            const statusDiv = document.getElementById('displaySpeechStatus');
            statusDiv.innerText = '';
            const hideSec = parseInt(document.getElementById('hideDelay').value);

            if (currentMode === 'numbers') {
                currentValue = Math.floor(Math.random() * (currentMaxNumber - currentMinNumber + 1)) + currentMinNumber;
                mainDisplay.innerText = currentValue;
                speak(currentValue);
            } else if (currentMode === 'sequence') {
                isSeqRevealed = false;
                const startNum = Math.floor(Math.random() * 996);
                currentSeqTarget = startNum + 4;
                
                seqArea.innerHTML = '';
                for (let i = 0; i < 6; i++) {
                    const num = startNum + i;
                    const box = document.createElement('div');
                    box.className = 'seq-box';
                    if (i === 4) {
                        box.classList.add('missing');
                        box.innerText = '?';
                        box.id = 'seqTargetBox';
                    } else {
                        box.innerText = num;
                    }
                    seqArea.appendChild(box);
                }

                if (document.getElementById('autoCheck').checked) {
                    setTimeout(() => { revealSeqTarget(); }, 2500);
                }

            } else if (currentMode === 'letters') {
                const charCode = Math.floor(Math.random() * 26) + 65;
                currentRawLetter = String.fromCharCode(charCode);
                currentValue = isUppercase ? currentRawLetter : currentRawLetter.toLowerCase();
                mainDisplay.innerText = currentValue;
                speak(currentValue);
            } else if (currentMode === 'syllables') {
                const pool = syllablesLevel === 1 ? syllablesN1 : syllablesN2;
                currentValue = pool[Math.floor(Math.random() * pool.length)];
                mainDisplay.innerText = currentValue;
                speak(currentValue);
            }

            if (document.getElementById('autoCheck').checked) {
                const delay = parseInt(document.getElementById('autoDelay').value) + (currentMode === 'sequence' ? 4 : hideSec);
                autoTimer = setTimeout(nextItem, delay * 1000);
            }
        }

        function speakCurrent() { 
            if (currentMode === 'sequence') {
                speak(currentSeqTarget.toString());
            } else {
                speak(currentValue.toString()); 
            }
        }

        function startSeqVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("La reconnaissance vocale n'est pas disponible.");
                return;
            }

            const micBtn = document.getElementById('btnSeqMic');
            const statusDiv = document.getElementById('displaySpeechStatus');
            
            const recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.continuous = false;

            recognition.onstart = () => {
                micBtn.classList.add('listening');
                statusDiv.innerText = "🎙️ J'écoute...";
            };

            recognition.onend = () => { micBtn.classList.remove('listening'); };
            recognition.onerror = () => {
                micBtn.classList.remove('listening');
                statusDiv.innerText = "Pas entendu, retente !";
            };

            recognition.onresult = (event) => {
                const spokenText = event.results[0][0].transcript.trim().toLowerCase();
                statusDiv.innerText = `Tu as dit : "${spokenText}"`;

                const parsedNum = parseInt(spokenText.replace(/[^0-9]/g, ''), 10);
                if (parsedNum === parseInt(currentSeqTarget, 10) || spokenText.includes(currentSeqTarget.toString())) {
                    revealSeqTarget();
                    triggerReward();
                } else {
                    speak("Ce n'est pas le bon nombre, essaye encore !");
                }
            };

            recognition.start();
        }

        function startQuiz() {
            currentMode = 'quiz';
            openScreen('screenQuiz');
            nextQuizQuestion();
        }

        function setQuizCategory(cat) {
            quizCategory = cat;
            document.getElementById('btnQuizCatNumbers').classList.toggle('active', cat === 'numbers');
            document.getElementById('btnQuizCatSeq').classList.toggle('active', cat === 'sequence');
            document.getElementById('btnQuizCatSyllables').classList.toggle('active', cat === 'syllables');
            
            document.getElementById('quizTypeGroup').style.display = cat === 'numbers' ? 'flex' : 'none';
            document.getElementById('quizSylGroup').style.display = cat === 'syllables' ? 'flex' : 'none';
            
            nextQuizQuestion();
        }

        function setQuizMode(mode) {
            quizMode = mode;
            document.getElementById('btnQuizMode1').classList.toggle('active', mode === 1);
            document.getElementById('btnQuizMode2').classList.toggle('active', mode === 2);
            nextQuizQuestion();
        }

        function setQuizSylLevel(lvl) {
            quizSylLevel = lvl;
            document.getElementById('btnQuizSylN1').classList.toggle('active', lvl === 1);
            document.getElementById('btnQuizSylN2').classList.toggle('active', lvl === 2);
            nextQuizQuestion();
        }

        function nextQuizQuestion() {
            const choicesContainer = document.getElementById('quizChoices');
            const bigDisplay = document.getElementById('quizBigDisplay');
            const seqDisplay = document.getElementById('quizSeqDisplay');
            const listenBtn = document.getElementById('btnListenAgain');
            const prompt = document.getElementById('quizPrompt');
            document.getElementById('speechStatus').innerText = '';

            choicesContainer.innerHTML = '';
            seqDisplay.style.display = 'none';

            if (quizCategory === 'numbers') {
                quizTarget = Math.floor(Math.random() * 1002);

                if (quizMode === 1) {
                    prompt.innerText = "Écoute et choisis ou dicte le bon nombre :";
                    bigDisplay.style.display = 'none';
                    listenBtn.style.display = 'inline-flex';

                    let choices = [quizTarget];
                    while (choices.length < 4) {
                        let rand = Math.floor(Math.random() * 1002);
                        if (!choices.includes(rand)) choices.push(rand);
                    }
                    choices.sort(() => Math.random() - 0.5);

                    choices.forEach(val => {
                        const btn = document.createElement('button');
                        btn.className = 'quiz-choice';
                        btn.innerText = val;
                        btn.onclick = () => checkQuizAnswer(val);
                        choicesContainer.appendChild(btn);
                    });

                    speakCurrentQuiz();
                } else {
                    prompt.innerText = "Lis le nombre fort ou dicte-le :";
                    bigDisplay.style.display = 'block';
                    bigDisplay.innerText = quizTarget;
                    listenBtn.style.display = 'none';

                    const btn = document.createElement('button');
                    btn.className = 'btn-action';
                    btn.style.gridColumn = "span 2";
                    btn.innerText = "J'ai répété ! ➔";
                    btn.onclick = () => triggerReward();
                    choicesContainer.appendChild(btn);

                    speak(quizTarget.toString());
                }
            } else if (quizCategory === 'sequence') {
                const startNum = Math.floor(Math.random() * 996);
                quizTarget = startNum + 4; 

                prompt.innerText = "Quel est le nombre manquant dans la suite ?";
                bigDisplay.style.display = 'none';
                listenBtn.style.display = 'none';
                seqDisplay.style.display = 'flex';
                seqDisplay.innerHTML = '';

                for (let i = 0; i < 6; i++) {
                    const num = startNum + i;
                    const box = document.createElement('div');
                    box.className = 'seq-box';
                    if (i === 4) {
                        box.classList.add('missing');
                        box.innerText = '?';
                    } else {
                        box.innerText = num;
                    }
                    seqDisplay.appendChild(box);
                }

                let choices = [quizTarget];
                while (choices.length < 4) {
                    let rand = Math.floor(Math.random() * 1002);
                    if (!choices.includes(rand)) choices.push(rand);
                }
                choices.sort(() => Math.random() - 0.5);

                choices.forEach(val => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-choice';
                    btn.innerText = val;
                    btn.onclick = () => checkQuizAnswer(val);
                    choicesContainer.appendChild(btn);
                });

                speak("Trouve le nombre manquant dans la suite !");

            } else if (quizCategory === 'syllables') {
                const pool = quizSylLevel === 1 ? syllablesN1 : syllablesN2;
                quizTarget = pool[Math.floor(Math.random() * pool.length)];

                prompt.innerText = "Écoute et sélectionne ou dicte la bonne syllabe :";
                bigDisplay.style.display = 'none';
                listenBtn.style.display = 'inline-flex';

                let choices = [quizTarget];
                while (choices.length < 4) {
                    let randSyl = pool[Math.floor(Math.random() * pool.length)];
                    if (!choices.includes(randSyl)) choices.push(randSyl);
                }
                choices.sort(() => Math.random() - 0.5);

                choices.forEach(val => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-choice';
                    btn.innerText = val;
                    btn.onclick = () => checkQuizAnswer(val);
                    choicesContainer.appendChild(btn);
                });

                speakCurrentQuiz();
            }
        }

        function speakCurrentQuiz() { 
            const isSyl = (quizCategory === 'syllables');
            speak(quizTarget.toString(), isSyl); 
        }

        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("La reconnaissance vocale n'est pas disponible.");
                return;
            }

            const micBtn = document.getElementById('btnMic');
            const statusDiv = document.getElementById('speechStatus');
            
            const recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.continuous = false;

            recognition.onstart = () => {
                micBtn.classList.add('listening');
                statusDiv.innerText = "🎙️ J'écoute...";
            };

            recognition.onend = () => { micBtn.classList.remove('listening'); };
            recognition.onerror = () => {
                micBtn.classList.remove('listening');
                statusDiv.innerText = "Pas entendu, retente !";
            };

            recognition.onresult = (event) => {
                const spokenText = event.results[0][0].transcript.trim().toLowerCase();
                statusDiv.innerText = `Tu as dit : "${spokenText}"`;

                let isCorrect = false;

                if (quizCategory === 'syllables') {
                    if (spokenText === quizTarget.toString().toLowerCase() || spokenText.replace(/[^a-z]/g, '') === quizTarget.toString().toLowerCase()) {
                        isCorrect = true;
                    }
                } else {
                    const parsedNum = parseInt(spokenText.replace(/[^0-9]/g, ''), 10);
                    if (parsedNum === parseInt(quizTarget, 10) || spokenText.includes(quizTarget.toString())) {
                        isCorrect = true;
                    }
                }

                if (isCorrect) {
                    quizScore += 1;
                    document.getElementById('scoreDisplay').innerText = `⭐ ${quizScore}`;
                    triggerReward();
                } else {
                    speak("Raté, essaye encore !");
                }
            };

            recognition.start();
        }

        function checkQuizAnswer(val) {
            if (val.toString() === quizTarget.toString()) {
                quizScore += 1;
                document.getElementById('scoreDisplay').innerText = `⭐ ${quizScore}`;
                triggerReward();
            } else {
                speak("Raté, essaye encore !");
            }
        }

        function triggerReward() {
            const overlay = document.getElementById('rewardOverlay');
            const msg = document.getElementById('rewardMsg');
            const rewardItem = rewards[Math.floor(Math.random() * rewards.length)];
            
            msg.innerHTML = `<span>${rewardItem.icon}</span> ${rewardItem.word}`;
            overlay.classList.add('show');
            
            speak(rewardItem.word);

            setTimeout(() => {
                overlay.classList.remove('show');
                if (currentMode === 'quiz') {
                    nextQuizQuestion();
                } else if (currentMode === 'sequence') {
                    nextItem();
                }
            }, 1800);
        }
    </script>
</body>
