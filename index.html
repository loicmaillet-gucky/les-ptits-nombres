<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu Éducatif - Nombres & Syllabes</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; }
        h1 { color: #333; margin-bottom: 25px; }
        .screen { display: none; }
        .screen.active { display: block; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .btn { background: #4A90E2; color: white; border: none; padding: 15px 20px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: transform 0.1s, background 0.2s; }
        .btn:hover { background: #357ABD; }
        .btn:active { transform: scale(0.98); }
        .btn-action { background: #2ECC71; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin: 5px; }
        .btn-action:hover { background: #27AE60; }
        .btn-back { background: #E74C3C; margin-top: 15px; }
        .btn-back:hover { background: #C0392B; }
        .btn-toggle { background: #e0e0e0; color: #333; padding: 10px; border-radius: 6px; border: none; cursor: pointer; margin: 0 5px; }
        .btn-toggle.active { background: #4A90E2; color: white; }
        .display-box { font-size: 72px; font-weight: bold; color: #2C3E50; margin: 30px 0; min-height: 100px; display: flex; align-items: center; justify-content: center; }
        .seq-area { display: flex; gap: 10px; justify-content: center; margin: 20px 0; }
        .seq-box { width: 60px; height: 60px; background: #eef2f5; border: 2px solid #bdc3c7; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; }
        .seq-box.missing { border-color: #E67E22; background: #FDEDEC; color: #E67E22; }
        .quiz-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .quiz-choice { background: #f8f9fa; border: 2px solid #e9ecef; font-size: 24px; font-weight: bold; padding: 20px; border-radius: 10px; cursor: pointer; }
        .quiz-choice:hover { border-color: #4A90E2; background: #eef6ff; }
        .reward-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; }
        .reward-overlay.show { display: flex; }
        .reward-card { background: white; padding: 40px; border-radius: 20px; text-align: center; font-size: 32px; font-weight: bold; }
        .reward-card span { font-size: 64px; display: block; margin-bottom: 10px; }
        .toggle-group { display: flex; justify-content: center; margin: 15px 0; flex-wrap: wrap; gap: 5px; }
        .mic-btn { background: #9B59B6; }
        .mic-btn.listening { background: #E74C3C; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="container">
    <!-- ÉCRAN MENU -->
    <div id="screenMenu" class="screen active">
        <h1>Apprentissage & Jeux</h1>
        <div class="btn-grid">
            <button class="btn" onclick="startNumbers(0, 1001)">Nombres (0-1000)</button>
            <button class="btn" onclick="startSequence()">Suite de Nombres</button>
            <button class="btn" onclick="startLetters()">Lettres</button>
            <button class="btn" onclick="startSyllables()">Syllabes</button>
        </div>
        <button class="btn" style="background:#F39C12; width:100%;" onclick="startQuiz()">🎯 Mode Quiz / Exercices</button>
        
        <div style="margin-top:25px; text-align:left; font-size:14px; background:#f9f9f9; padding:15px; border-radius:8px;">
            <button class="btn-action" style="font-size:14px; padding:6px 12px;" onclick="testSpeech()">🔊 Tester la voix (fr-FR)</button>
        </div>
    </div>

    <!-- ÉCRAN AFFICHAGE -->
    <div id="screenDisplay" class="screen">
        <h2 id="displayTitle">---</h2>
        
        <div id="lettersToggle" class="toggle-group" style="display:none;">
            <button id="btnMAJ" class="btn-toggle active" onclick="setCase(true)">MAJUSCULES</button>
            <button id="btnMIN" class="btn-toggle" onclick="setCase(false)">minuscules</button>
        </div>

        <div id="syllablesToggle" class="toggle-group" style="display:none;">
            <button id="btnSylN1" class="btn-toggle active" onclick="setSyllablesLevel(1)">2 Lettres (Niveau 1)</button>
            <button id="btnSylN2" class="btn-toggle" onclick="setSyllablesLevel(2)">3 Lettres (Niveau 2)</button>
        </div>

        <div id="mainText" class="display-box">--</div>
        <div id="sequenceArea" class="seq-area" style="display:none;"></div>

        <div>
            <button class="btn-action" onclick="speakCurrent()">🔊 Écouter</button>
            <button class="btn-action" onclick="nextItem()">Suivant ➔</button>
            <button id="btnDisplayMic" class="btn-action mic-btn" style="display:none;" onclick="startDisplayVoiceRecognition()">🎙️ Dicter</button>
        </div>
        <div id="displaySpeechStatus" style="margin-top:10px; font-weight:bold; color:#7F8C8D;"></div>

        <button class="btn btn-back" onclick="stopAutoAndBack()">🏠 Retour au Menu</button>
    </div>

    <!-- ÉCRAN QUIZ -->
    <div id="screenQuiz" class="screen">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Exercices</h2>
            <div id="scoreDisplay" style="font-size:20px; font-weight:bold; color:#F39C12;">⭐ 0</div>
        </div>

        <div class="toggle-group">
            <button id="btnQuizCatNumbers" class="btn-toggle active" onclick="setQuizCategory('numbers')">Nombres</button>
            <button id="btnQuizCatSeq" class="btn-toggle" onclick="setQuizCategory('sequence')">Suites</button>
            <button id="btnQuizCatSyllables" class="btn-toggle" onclick="setQuizCategory('syllables')">Syllabes</button>
        </div>

        <div id="quizTypeGroup" class="toggle-group">
            <button id="btnQuizMode1" class="btn-toggle active" onclick="setQuizMode(1)">Écoute ➔ Choisis</button>
            <button id="btnQuizMode2" class="btn-toggle" onclick="setQuizMode(2)">Lis ➔ Répète</button>
        </div>

        <div id="quizSylGroup" class="toggle-group" style="display:none;">
            <button id="btnQuizSylN1" class="btn-toggle active" onclick="setQuizSylLevel(1)">2 Lettres</button>
            <button id="btnQuizSylN2" class="btn-toggle" onclick="setQuizSylLevel(2)">3 Lettres</button>
        </div>

        <p id="quizPrompt" style="font-size:18px; font-weight:bold; margin-top:15px;">Écoute et choisis le bon nombre :</p>
        
        <div id="quizBigDisplay" class="display-box" style="display:none;">--</div>
        <div id="quizSeqDisplay" class="seq-area" style="display:none;"></div>

        <div>
            <button id="btnListenAgain" class="btn-action" onclick="speakCurrentQuiz()">🔊 Réécouter</button>
            <button id="btnMic" class="btn-action mic-btn" onclick="startVoiceRecognition()">🎙️ Dicter la réponse</button>
        </div>
        <div id="speechStatus" style="margin-top:10px; font-weight:bold; color:#7F8C8D;"></div>

        <div id="quizChoices" class="quiz-choices"></div>

        <button class="btn btn-back" onclick="openScreen('screenMenu')">🏠 Quitter le Quiz</button>
    </div>
</div>

<!-- OVERLAY DE RÉCOMPENSE -->
<div id="rewardOverlay" class="reward-overlay">
    <div class="reward-card">
        <div id="rewardMsg"><span>🎉</span> Bravo !</div>
    </div>
</div>

<script>
    let currentMode = '';
    let currentMinNumber = 0;
    let currentMaxNumber = 1001;
    let isUppercase = true;
    let currentRawLetter = 'A';
    let syllablesLevel = 1;
    let currentValue = '';
    let currentSeqTarget = 0;
    let isSeqRevealed = false;

    let quizScore = 0;
    let quizCategory = 'numbers'; 
    let quizSylLevel = 1;         
    let quizTarget = '';
    let quizMode = 1;             

    let frenchVoices = [];
    let activeRecognition = null;

    // Épellation phonétique stricte des lettres isolées
    const frenchLetterSpellings = {
        'A':'A', 'B':'Bé', 'C':'Cé', 'D':'Dé', 'E':'E', 'É':'É', 'È':'È', 'F':'Èf', 'G':'Gé', 'H':'Hache',
        'I':'I', 'J':'Ji', 'K':'Ka', 'L':'Èl', 'M':'Èm', 'N':'Ène', 'O':'O', 'P':'Pé',
        'Q':'Ku', 'R':'Ère', 'S':'Èsse', 'T':'Té', 'U':'U', 'V':'Vé', 'W':'Double Vé',
        'X':'Iks', 'Y':'Igrek', 'Z':'Zède'
    };

    // Base de données syllabes
    const syllablesN1 = [
        "ba", "bé", "be", "bi", "bo", "bu", 
        "da", "fa", "lu", "ma", "pi", "ra", 
        "se", "sé", "ta", "vu",
        "an", "en", "in", "on", "un", "ou", "au", "eu",
        "ar", "es", "il", "or", "ur"
    ];

    const syllablesN2 = [
        "bra", "cha", "cri", "dra", "fro", "pla", "pro", "tra",
        "bar", "col", "mer", "mur", "sac", "top", "val",
        "eau", "ein", "oin", "san", "son", "toi", "vou"
    ];

    // Ajustements phonétiques sans aucun son "Sse"
    const phoneticAdjustments = {
        "be": "beu",
        "de": "deu",
        "fe": "feu",
        "le": "leu",
        "me": "meu",
        "ne": "neu",
        "pe": "peu",
        "re": "reu",
        "te": "teu",
        "ve": "veu",
        "in": "ain",
        "ein": "un",
        "oin": "ouin",
        "top": "tope",
        "mer": "mèr",
        "eu": "euh",
        "eau": "ô",
        "au": "ô"
    };

    const rewards = [
        { icon: "🎉", word: "Bravo !" },
        { icon: "⭐", word: "Super !" },
        { icon: "🏆", word: "Champion des Syllabes !" }
    ];

    function stopRecognition() {
        if (activeRecognition) {
            try { activeRecognition.stop(); } catch(e) {}
            activeRecognition = null;
        }
    }

    function initVoices() {
        if ('speechSynthesis' in window) {
            const allVoices = window.speechSynthesis.getVoices();
            
            frenchVoices = allVoices.filter(v => {
                if (!v.lang) return false;
                const langLower = v.lang.toLowerCase().replace('_', '-');
                return langLower === 'fr-fr';
            });

            if (frenchVoices.length === 0) {
                frenchVoices = allVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
            }
        }
    }

    if ('speechSynthesis' in window) {
        initVoices();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = initVoices;
        }
    }

    function testSpeech() {
        speak("sac", true);
    }

    document.addEventListener('click', () => {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.resume();
        }
    }, { capture: true });

    function formatSyllablePhonetics(syl) {
        let clean = syl.toLowerCase().trim();
        
        if (phoneticAdjustments[clean]) {
            clean = phoneticAdjustments[clean];
        } else if (clean.length > 1 && clean.endsWith('e') && !clean.endsWith('ee') && !clean.endsWith('ie')) {
            clean = clean.slice(0, -1) + 'eu';
        }
        
        // Remplacement strict de toute lettre 's' par la prononciation 'Èsse'
        clean = clean.replace(/s+/g, ' Èsse ');
        
        return clean.trim();
    }

    function speak(text, forceSyllables = false) {
        if (!('speechSynthesis' in window)) return;
        if (text === undefined || text === null || text === '') return;

        stopRecognition();

        const synth = window.speechSynthesis;
        synth.cancel();
        synth.resume();

        let rawText = text.toString();
        let textToSay = rawText;

        if (forceSyllables || currentMode === 'syllables' || (currentMode === 'quiz' && quizCategory === 'syllables')) {
            const chars = rawText.toUpperCase().split('');
            const spelledArr = chars.map(char => frenchLetterSpellings[char] || char);
            
            const spelled = spelledArr.join('... ');
            const phoneticSyllable = formatSyllablePhonetics(rawText);
            textToSay = `${spelled}... ... ${phoneticSyllable}`;
        } else if (currentMode === 'letters') {
            const upperChar = rawText.toUpperCase();
            textToSay = frenchLetterSpellings[upperChar] || rawText;
        }

        const utterance = new SpeechSynthesisUtterance(textToSay);
        utterance.lang = 'fr-FR';
        utterance.pitch = 1.0;
        utterance.rate = 0.5;

        if (frenchVoices.length > 0) {
            const preferredVoice = frenchVoices.find(v => v.default) || frenchVoices[0];
            utterance.voice = preferredVoice;
        }

        synth.speak(utterance);
    }

    function openScreen(screenId) {
        stopRecognition();
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function stopAutoAndBack() {
        stopRecognition();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        openScreen('screenMenu');
    }

    function startNumbers(min = 0, max = 1001) {
        currentMode = 'numbers';
        currentMinNumber = min;
        currentMaxNumber = max;
        document.getElementById('displayTitle').innerText = `Nombres (${min}-${max})`;
        document.getElementById('lettersToggle').style.display = 'none';
        document.getElementById('syllablesToggle').style.display = 'none';
        document.getElementById('sequenceArea').style.display = 'none';
        document.getElementById('btnDisplayMic').style.display = 'inline-flex';
        document.getElementById('displaySpeechStatus').innerText = '';
        document.getElementById('mainText').style.display = 'block';
        openScreen('screenDisplay');
        nextItem();
    }

    function startSequence() {
        currentMode = 'sequence';
        document.getElementById('displayTitle').innerText = "Suite de Nombres";
        document.getElementById('lettersToggle').style.display = 'none';
        document.getElementById('syllablesToggle').style.display = 'none';
        document.getElementById('mainText').style.display = 'none';
        document.getElementById('sequenceArea').style.display = 'flex';
        document.getElementById('btnDisplayMic').style.display = 'inline-flex';
        document.getElementById('displaySpeechStatus').innerText = '';
        openScreen('screenDisplay');
        nextItem();
    }

    function startLetters() {
        currentMode = 'letters';
        document.getElementById('displayTitle').innerText = "Lettres";
        document.getElementById('lettersToggle').style.display = 'flex';
        document.getElementById('syllablesToggle').style.display = 'none';
        document.getElementById('sequenceArea').style.display = 'none';
        document.getElementById('btnDisplayMic').style.display = 'none';
        document.getElementById('displaySpeechStatus').innerText = '';
        document.getElementById('mainText').style.display = 'block';
        openScreen('screenDisplay');
        nextItem();
    }

    function setCase(upper) {
        isUppercase = upper;
        document.getElementById('btnMAJ').classList.toggle('active', upper);
        document.getElementById('btnMIN').classList.toggle('active', !upper);
        
        if (currentMode === 'letters') {
            currentValue = isUppercase ? currentRawLetter : currentRawLetter.toLowerCase();
            document.getElementById('mainText').innerText = currentValue;
            speak(currentValue);
        }
    }

    function startSyllables() {
        currentMode = 'syllables';
        document.getElementById('displayTitle').innerText = "Syllabes";
        document.getElementById('lettersToggle').style.display = 'none';
        document.getElementById('syllablesToggle').style.display = 'flex';
        document.getElementById('sequenceArea').style.display = 'none';
        document.getElementById('btnDisplayMic').style.display = 'none';
        document.getElementById('displaySpeechStatus').innerText = '';
        document.getElementById('mainText').style.display = 'block';
        openScreen('screenDisplay');
        nextItem();
    }

    function setSyllablesLevel(lvl) {
        syllablesLevel = lvl;
        document.getElementById('btnSylN1').classList.toggle('active', lvl === 1);
        document.getElementById('btnSylN2').classList.toggle('active', lvl === 2);
        nextItem();
    }

    function revealSeqTarget() {
        if (isSeqRevealed) return;
        isSeqRevealed = true;
        const targetBox = document.getElementById('seqTargetBox');
        if (targetBox) {
            targetBox.innerText = currentSeqTarget;
            speak(`Le nombre manquant est ${currentSeqTarget}`);
        }
    }

    function nextItem() {
        const mainDisplay = document.getElementById('mainText');
        const seqArea = document.getElementById('sequenceArea');
        const statusDiv = document.getElementById('displaySpeechStatus');
        statusDiv.innerText = '';

        if (currentMode === 'numbers') {
            currentValue = Math.floor(Math.random() * (currentMaxNumber - currentMinNumber + 1)) + currentMinNumber;
            mainDisplay.innerText = currentValue;
            speak(currentValue);
        } else if (currentMode === 'sequence') {
            isSeqRevealed = false;
            const startNum = Math.floor(Math.random() * 996);
            currentSeqTarget = startNum + 4;
            
            seqArea.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                const num = startNum + i;
                const box = document.createElement('div');
                box.className = 'seq-box';
                if (i === 4) {
                    box.classList.add('missing');
                    box.innerText = '?';
                    box.id = 'seqTargetBox';
                } else {
                    box.innerText = num;
                }
                seqArea.appendChild(box);
            }

        } else if (currentMode === 'letters') {
            const charCode = Math.floor(Math.random() * 26) + 65;
            currentRawLetter = String.fromCharCode(charCode);
            currentValue = isUppercase ? currentRawLetter : currentRawLetter.toLowerCase();
            mainDisplay.innerText = currentValue;
            speak(currentValue);
        } else if (currentMode === 'syllables') {
            const pool = syllablesLevel === 1 ? syllablesN1 : syllablesN2;
            currentValue = pool[Math.floor(Math.random() * pool.length)];
            mainDisplay.innerText = currentValue;
            speak(currentValue, true);
        }
    }

    function speakCurrent() { 
        if (currentMode === 'sequence') {
            speak(currentSeqTarget.toString());
        } else {
            speak(currentValue.toString(), currentMode === 'syllables'); 
        }
    }

    function startDisplayVoiceRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("La reconnaissance vocale n'est pas disponible sur votre navigateur.");
            return;
        }

        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        stopRecognition();

        const micBtn = document.getElementById('btnDisplayMic');
        const statusDiv = document.getElementById('displaySpeechStatus');
        
        const recognition = new SpeechRecognition();
        activeRecognition = recognition;
        recognition.lang = 'fr-FR';
        recognition.continuous = false;

        recognition.onstart = () => {
            micBtn.classList.add('listening');
            statusDiv.innerText = "🎙️ J'écoute...";
        };

        recognition.onend = () => { 
            micBtn.classList.remove('listening'); 
            activeRecognition = null;
        };

        recognition.onerror = () => {
            micBtn.classList.remove('listening');
            statusDiv.innerText = "Pas entendu, retente !";
            activeRecognition = null;
        };

        recognition.onresult = (event) => {
            const spokenText = event.results[0][0].transcript.trim().toLowerCase();
            statusDiv.innerText = `Tu as dit : "${spokenText}"`;

            const target = (currentMode === 'sequence') ? currentSeqTarget : currentValue;
            const parsedNum = parseInt(spokenText.replace(/[^0-9]/g, ''), 10);

            if (parsedNum === parseInt(target, 10) || spokenText.includes(target.toString())) {
                if (currentMode === 'sequence') {
                    revealSeqTarget();
                }
                triggerReward();
            } else {
                speak("Ce n'est pas la bonne réponse, essaye encore !");
            }
        };

        recognition.start();
    }

    function startQuiz() {
        currentMode = 'quiz';
        openScreen('screenQuiz');
        nextQuizQuestion();
    }

    function setQuizCategory(cat) {
        quizCategory = cat;
        document.getElementById('btnQuizCatNumbers').classList.toggle('active', cat === 'numbers');
        document.getElementById('btnQuizCatSeq').classList.toggle('active', cat === 'sequence');
        document.getElementById('btnQuizCatSyllables').classList.toggle('active', cat === 'syllables');
        
        document.getElementById('quizTypeGroup').style.display = cat === 'numbers' ? 'flex' : 'none';
        document.getElementById('quizSylGroup').style.display = cat === 'syllables' ? 'flex' : 'none';
        
        nextQuizQuestion();
    }

    function setQuizMode(mode) {
        quizMode = mode;
        document.getElementById('btnQuizMode1').classList.toggle('active', mode === 1);
        document.getElementById('btnQuizMode2').classList.toggle('active', mode === 2);
        nextQuizQuestion();
    }

    function setQuizSylLevel(lvl) {
        quizSylLevel = lvl;
        document.getElementById('btnQuizSylN1').classList.toggle('active', lvl === 1);
        document.getElementById('btnQuizSylN2').classList.toggle('active', lvl === 2);
        nextQuizQuestion();
    }

    function nextQuizQuestion() {
        const choicesContainer = document.getElementById('quizChoices');
        const bigDisplay = document.getElementById('quizBigDisplay');
        const seqDisplay = document.getElementById('quizSeqDisplay');
        const listenBtn = document.getElementById('btnListenAgain');
        const micBtn = document.getElementById('btnMic');
        const prompt = document.getElementById('quizPrompt');
        document.getElementById('speechStatus').innerText = '';

        choicesContainer.innerHTML = '';
        seqDisplay.style.display = 'none';

        if (quizCategory === 'numbers') {
            quizTarget = Math.floor(Math.random() * 1002);
            micBtn.style.display = 'inline-flex';

            if (quizMode === 1) {
                prompt.innerText = "Écoute et choisis ou dicte le bon nombre :";
                bigDisplay.style.display = 'none';
                listenBtn.style.display = 'inline-flex';

                let choices = [quizTarget];
                while (choices.length < 4) {
                    let rand = Math.floor(Math.random() * 1002);
                    if (!choices.includes(rand)) choices.push(rand);
                }
                choices.sort(() => Math.random() - 0.5);

                choices.forEach(val => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-choice';
                    btn.innerText = val;
                    btn.onclick = () => checkQuizAnswer(val);
                    choicesContainer.appendChild(btn);
                });

                speakCurrentQuiz();
            } else {
                prompt.innerText = "Lis le nombre fort ou dicte-le :";
                bigDisplay.style.display = 'block';
                bigDisplay.innerText = quizTarget;
                listenBtn.style.display = 'none';

                const btn = document.createElement('button');
                btn.className = 'btn-action';
                btn.style.gridColumn = "span 2";
                btn.innerText = "J'ai répété ! ➔";
                btn.onclick = () => triggerReward();
                choicesContainer.appendChild(btn);

                speak(quizTarget.toString());
            }
        } else if (quizCategory === 'sequence') {
            const startNum = Math.floor(Math.random() * 996);
            quizTarget = startNum + 4; 

            prompt.innerText = "Quel est le nombre manquant dans la suite ?";
            bigDisplay.style.display = 'none';
            listenBtn.style.display = 'none';
            micBtn.style.display = 'inline-flex';
            seqDisplay.style.display = 'flex';
            seqDisplay.innerHTML = '';

            for (let i = 0; i < 6; i++) {
                const num = startNum + i;
                const box = document.createElement('div');
                box.className = 'seq-box';
                if (i === 4) {
                    box.classList.add('missing');
                    box.innerText = '?';
                } else {
                    box.innerText = num;
                }
                seqDisplay.appendChild(box);
            }

            let choices = [quizTarget];
            while (choices.length < 4) {
                let rand = Math.floor(Math.random() * 1002);
                if (!choices.includes(rand)) choices.push(rand);
            }
            choices.sort(() => Math.random() - 0.5);

            choices.forEach(val => {
                const btn = document.createElement('button');
                btn.className = 'quiz-choice';
                btn.innerText = val;
                btn.onclick = () => checkQuizAnswer(val);
                choicesContainer.appendChild(btn);
            });

            speak("Trouve le nombre manquant dans la suite !");

        } else if (quizCategory === 'syllables') {
            const pool = quizSylLevel === 1 ? syllablesN1 : syllablesN2;
            quizTarget = pool[Math.floor(Math.random() * pool.length)];

            prompt.innerText = "Écoute et sélectionne la bonne syllabe :";
            bigDisplay.style.display = 'none';
            listenBtn.style.display = 'inline-flex';
            micBtn.style.display = 'none';

            let choices = [quizTarget];
            while (choices.length < 4) {
                let randSyl = pool[Math.floor(Math.random() * pool.length)];
                if (!choices.includes(randSyl)) choices.push(randSyl);
            }
            choices.sort(() => Math.random() - 0.5);

            choices.forEach(val => {
                const btn = document.createElement('button');
                btn.className = 'quiz-choice';
                btn.innerText = val;
                btn.onclick = () => checkQuizAnswer(val);
                choicesContainer.appendChild(btn);
            });

            speakCurrentQuiz();
        }
    }

    function speakCurrentQuiz() { 
        const isSyl = (quizCategory === 'syllables');
        speak(quizTarget.toString(), isSyl); 
    }

    function startVoiceRecognition() {
        if (quizCategory === 'syllables') return;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("La reconnaissance vocale n'est pas disponible sur votre navigateur.");
            return;
        }

        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        stopRecognition();

        const micBtn = document.getElementById('btnMic');
        const statusDiv = document.getElementById('speechStatus');
        
        const recognition = new SpeechRecognition();
        activeRecognition = recognition;
        recognition.lang = 'fr-FR';
        recognition.continuous = false;

        recognition.onstart = () => {
            micBtn.classList.add('listening');
            statusDiv.innerText = "🎙️ J'écoute...";
        };

        recognition.onend = () => { 
            micBtn.classList.remove('listening'); 
            activeRecognition = null;
        };

        recognition.onerror = () => {
            micBtn.classList.remove('listening');
            statusDiv.innerText = "Pas entendu, retente !";
            activeRecognition = null;
        };

        recognition.onresult = (event) => {
            const spokenText = event.results[0][0].transcript.trim().toLowerCase();
            statusDiv.innerText = `Tu as dit : "${spokenText}"`;

            let isCorrect = false;

            const parsedNum = parseInt(spokenText.replace(/[^0-9]/g, ''), 10);
            if (parsedNum === parseInt(quizTarget, 10) || spokenText.includes(quizTarget.toString())) {
                isCorrect = true;
            }

            if (isCorrect) {
                quizScore += 1;
                document.getElementById('scoreDisplay').innerText = `⭐ ${quizScore}`;
                triggerReward();
            } else {
                speak("Raté, essaye encore !");
            }
        };

        recognition.start();
    }

    function checkQuizAnswer(val) {
        if (val.toString() === quizTarget.toString()) {
            quizScore += 1;
            document.getElementById('scoreDisplay').innerText = `⭐ ${quizScore}`;
            triggerReward();
        } else {
            speak("Raté, essaye encore !");
        }
    }

    function triggerReward() {
        const overlay = document.getElementById('rewardOverlay');
        const msg = document.getElementById('rewardMsg');
        const rewardItem = rewards[Math.floor(Math.random() * rewards.length)];
        
        msg.innerHTML = `<span>${rewardItem.icon}</span> ${rewardItem.word}`;
        overlay.classList.add('show');
        
        speak(rewardItem.word);

        setTimeout(() => {
            overlay.classList.remove('show');
            if (currentMode === 'quiz') {
                nextQuizQuestion();
            } else if (currentMode === 'sequence' || currentMode === 'numbers') {
                nextItem();
            }
        }, 1800);
    }
</script>
